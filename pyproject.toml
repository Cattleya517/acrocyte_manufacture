[project]
name = "acrocyte-manufacture"
version = "0.1.0"
description = "Batch image stitching CLI built on Ashlar for MetaXpress/MetaMorph microscopy tiles."
requires-python = ">=3.11,<3.13"
readme = "README.md"
dependencies = [
    "ashlar>=1.17.0",
    "zarr>=2.18,<3",  # zarr 3 changed make_store API; ashlar pyramid writer breaks on >=3
    "scikit-image>=0.19.3,<0.23",
    "tifffile>=2022.7.28,<2025.2.18",
    "numpy>=1.24,<2.0",  # scikit-image 0.22 wheels are built against numpy 1.x ABI
    "pandas>=2.0",
    "tqdm>=4.65",
    "networkx>=3.1",
]

[project.scripts]
acrocyte-manufacture = "acrocyte_manufacture.cli:main"
stitch = "acrocyte_manufacture.cli:main"  # short alias

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acrocyte_manufacture"]
